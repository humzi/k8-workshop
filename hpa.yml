apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: hello-web-hpa }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: hello-web }
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: { type: Utilization, averageUtilization: 50 }  # % of REQUESTS, not limits —
                                                                 # this is why correct requests
                                                                 # from Module 1 actually matter
