apiVersion: v1
kind: ServiceAccount
metadata: { name: readonly-bot }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: pod-reader }
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]   # least privilege: only what's needed, nothing else
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: readonly-bot-binding }
subjects:
- kind: ServiceAccount
  name: readonly-bot
roleRef: { kind: Role, name: pod-reader, apiGroup: rbac.authorization.k8s.io }
